name: Validate private deployment

on:
  push:
    branches: [secure-monitor]
  pull_request:
    branches: [secure-monitor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run build:frontend

# Production deployment is managed by Cloudflare Workers Builds. This workflow
# needs no Cloudflare credentials and cannot publish a second public endpoint.
