# Private deployment: Cloudflare Workers Builds uses secure-monitor, not the upstream sync branch.
name = "cf-server-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

keep_vars = true
workers_dev = true
preview_urls = false

[vars]
CORS_ALLOWED_ORIGINS = "https://cf-server-monitor.1165101405.workers.dev"

# 定时任务配置（UTC）
# - 每分钟：执行离线节点、资源告警
# - 每小时：合并执行其他定时任务（表轮换、旧表清理、按配置时区/小时触发服务器到期检测）
# - 注意同步修改deploy和index.js scheduled函数里面的值
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cf-server-monitor-db"
database_id = "b1ee9de6-8cca-4a3a-b999-5b253a434bac"

# Durable Objects：实时指标广播中心
# 注意：首次部署前需要执行 `wrangler durable-object create MetricsBroadcaster --class MetricsBroadcaster`
# 或者在部署后，wrangler 会自动创建对应的 DO namespace。
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
